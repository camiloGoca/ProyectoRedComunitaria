<div class="users-container">
  <a routerLink="/dashboard" class="btn btn-back">← Volver al Dashboard</a>
  
  <div class="header">
    <h1>Gestión de Usuarios</h1>
    <button class="btn btn-primary" (click)="openForm()">+ Nuevo Usuario</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>
              <button class="btn btn-edit" (click)="editUser(user)">Editar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  @if (showForm) {
    <div class="form-modal" (click)="closeForm()">
      <div class="form-content" (click)="$event.stopPropagation()">
        <h2>{{ isEditing ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
        <form (ngSubmit)="saveUser()">
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" [(ngModel)]="currentUser.username" name="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="currentUser.email" name="email" required />
          </div>
          @if (!isEditing) {
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" [(ngModel)]="currentUser.password" name="password" required />
            </div>
          }
          <div class="form-group">
            <label for="role">Rol</label>
            <select id="role" [(ngModel)]="currentUser.role" name="role" required>
              <option value="USER">Usuario</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" (click)="closeForm()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
