<div class="users-container">
  <a routerLink="/dashboard" class="btn btn-back">← Volver al Dashboard</a>
  
  <div class="header">
    <h1>Gestión de Ubicaciones</h1>
    <button class="btn btn-primary" (click)="openForm()">+ Nueva Ubicación</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>País</th>
          <th>Región</th>
          <th>Ciudad</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (location of locations; track location.id) {
          <tr>
            <td>{{ location.id }}</td>
            <td>{{ location.country }}</td>
            <td>{{ location.region }}</td>
            <td>{{ location.city }}</td>
            <td>
              <button class="btn btn-edit" (click)="editLocation(location)">Editar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  @if (showForm) {
    <div class="form-modal" (click)="closeForm()">
      <div class="form-content" (click)="$event.stopPropagation()">
        <h2>{{ isEditing ? 'Editar Ubicación' : 'Nueva Ubicación' }}</h2>
        <form (ngSubmit)="saveLocation()">
          <div class="form-group">
            <label for="country">País</label>
            <input type="text" id="country" [(ngModel)]="currentLocation.country" name="country" required />
          </div>
          <div class="form-group">
            <label for="region">Región</label>
            <input type="text" id="region" [(ngModel)]="currentLocation.region" name="region" required />
          </div>
          <div class="form-group">
            <label for="city">Ciudad</label>
            <input type="text" id="city" [(ngModel)]="currentLocation.city" name="city" />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" (click)="closeForm()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
